version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencias, seguridad]
    groups:
      flask-y-utilidades:
        patterns: ["Flask", "python-dotenv", "gunicorn"]
      base-de-datos:
        patterns: ["psycopg*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencias, ci]
