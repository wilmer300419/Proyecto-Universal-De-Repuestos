# Completa organization y projectKey con los de tu proyecto en https://sonarcloud.io
# (Administration > Analysis Method > GitHub Actions) y agrega el secreto SONAR_TOKEN al repositorio.
sonar.organization=CAMBIAR_ORGANIZACION
sonar.projectKey=CAMBIAR_ORGANIZACION_repuestos-api
sonar.projectName=Universal de Repuestos WG - API
sonar.projectVersion=3.0.0

sonar.sources=app,Seguridad,migraciones,tools
sonar.tests=tests
sonar.exclusions=**/__pycache__/**
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
