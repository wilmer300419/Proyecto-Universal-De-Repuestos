name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Validación de código y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ruff (estilo, bugs probables, seguridad tipo bandit, complejidad)
        run: ruff check . --output-format github
      - name: Compilación de todos los módulos
        run: python -m compileall -q app Seguridad migraciones tools
      - name: pip-audit (dependencias con vulnerabilidades conocidas)
        run: pip-audit -r requirements.txt --progress-spinner off

  pruebas:
    name: Pruebas unitarias, de integración y regresión (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: calidad
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repuestos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repuestos_test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # SonarCloud necesita el historial completo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas con cobertura
        run: >-
          pytest -q --cov=app --cov=Seguridad --cov=migraciones --cov-branch
          --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=reports/pytest.xml
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            coverage.xml
            reports/pytest.xml
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarCloud Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Aviso si SonarCloud no está configurado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::Define el secreto SONAR_TOKEN y las claves de sonar-project.properties para analizar en SonarCloud"

  mutacion:
    name: Mutation Testing (mutmut) · falla si el score < 50 %
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar mutmut
        # mutmut devuelve código distinto de 0 cuando hay sobrevivientes; la decisión la toma el paso siguiente
        run: mutmut run --no-progress || true
      - name: Resultados
        if: always()
        run: mutmut results || true
      - name: Validar Mutation Score (umbral 50 %, objetivo 60 %)
        run: python tools/mutation_score.py --umbral 50 --objetivo 60
      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mutacion
          path: |
            mutation-report.json
            .mutmut-cache
