# Configuración de mutmut 2.x (mutation testing). Se ejecuta en GitHub Actions (job "mutacion").
# Se mutan los módulos de lógica pura (reglas de negocio, validación y seguridad); el runner usa las pruebas
# que no requieren base de datos para que cada mutante se evalúe en segundos.
[mutmut]
paths_to_mutate=app/models/negocio.py,app/models/validacion.py,app/models/errores.py,app/models/meta.py,Seguridad/contrasenas.py,Seguridad/limitador.py,Seguridad/modelos.py,Seguridad/tokens.py
runner=python -m pytest -x -q -p no:cacheprovider tests/test_unitarias.py tests/test_regresion.py tests/test_seguridad.py tests/test_mutacion.py
tests_dir=tests/
